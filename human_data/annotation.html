<!doctype html><html><head><meta charset="utf-8"><title>The Unfixed User — Pairwise Annotation</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #ccc;border-radius:12px;padding:16px}button{padding:10px 18px;margin:8px}</style></head><body><h1>Pairwise personalization annotation</h1><p>This local UI is intentionally storage-free. Export each judgment as JSON and append it to <code>human_data/labels.jsonl</code>. It supports real human evaluation without embedding fabricated labels in the repository.</p><label>Scenario</label><textarea id="scenario"></textarea><div class="row"><div class="card"><h3>Response A</h3><textarea id="a"></textarea></div><div class="card"><h3>Response B</h3><textarea id="b"></textarea></div></div><h3>Choose better response</h3><button onclick="vote('A')">A</button><button onclick="vote('B')">B</button><button onclick="vote('tie')">Tie</button><label><input type="checkbox" id="over"> Winner is over-personalized</label><pre id="out"></pre><script>function vote(w){let x={scenario:scenario.value,response_a:a.value,response_b:b.value,winner:w,over_personalized:over.checked};out.textContent=JSON.stringify(x);navigator.clipboard?.writeText(JSON.stringify(x));}</script></body></html>
