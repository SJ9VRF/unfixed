<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Unfixed User Demo</title><style>body{font-family:Inter,Arial;background:#090b0f;color:#f3f5f7;margin:0}main{max-width:1100px;margin:auto;padding:40px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#141922;border:1px solid #28303d;border-radius:18px;padding:22px}textarea,input{width:100%;box-sizing:border-box;background:#0d1117;color:#fff;border:1px solid #394354;border-radius:10px;padding:12px;margin:7px 0}button{padding:11px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-wrap:break-word;color:#d7deea}.small{color:#99a5b5} @media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>The Unfixed User</h1><p class="small">Local research demo. Start the API, then use this UI to inspect whether personalization is applied or withheld.</p><div class="grid"><section class="panel"><h2>Request</h2><input id="user" value="demo-user" placeholder="user id"><input id="key" value="answer_detail" placeholder="preference key"><textarea id="prompt" rows="6">Explain gradient descent using my usual level of detail.</textarea><button onclick="send()">Respond</button><p class="small">API expected at http://127.0.0.1:8000</p></section><section class="panel"><h2>Grounding trace</h2><pre id="out">Run a request to inspect the result.</pre></section></div></main><script>async function send(){let out=document.getElementById('out');out.textContent='Calling local API…';try{let r=await fetch('http://127.0.0.1:8000/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.value,prompt:prompt.value,relevant_preference:key.value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='Could not reach the local API. Start: uvicorn api.app:app --reload\n\n'+e}}</script></body></html>
